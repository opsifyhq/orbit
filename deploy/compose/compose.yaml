name: orbit

# Local development stack. Production/Kubernetes uses the Helm chart, not this file.
# Postgres and NATS are bound to 127.0.0.1 so their dev credentials are never reachable
# from other hosts. The launcher (Docker socket, dev token) and the NATS monitor are not
# published at all; the API reaches the launcher over the Compose network. The API and
# web stay on all interfaces because worker containers started by the launcher reach the
# API through host.docker.internal (the bridge IP on Linux); they run dev auth, so don't
# expose this stack on an untrusted network.
#   docker compose -f deploy/compose/compose.yaml up --build

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - orbit-nats:/data
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    image: orbit-api:dev
    environment:
      ORBIT_ENV: ${ORBIT_ENV:-development}
      ORBIT_AUTH_MODE: ${ORBIT_AUTH_MODE:-dev}
      ORBIT_DEV_AUTH_ALLOW_ANONYMOUS: ${ORBIT_DEV_AUTH_ALLOW_ANONYMOUS:-true}
      ORBIT_DEV_TOKEN: ${ORBIT_DEV_TOKEN:-orbit-dev-token}
      ORBIT_SEED_DEMO: ${ORBIT_SEED_DEMO:-true}
      ORBIT_DATABASE_URL: postgres://orbit:orbit@db:5432/orbit
      ORBIT_MASTER_KEY: ${ORBIT_MASTER_KEY:-b3JiaXQtZGV2LW1hc3Rlci1rZXktMzItYnl0ZXMhISE=}
      ORBIT_EVENTS_DRIVER: ${ORBIT_EVENTS_DRIVER:-nats}
      ORBIT_NATS_URL: nats://nats:4222
      ORBIT_CORS_ORIGINS: ${ORBIT_CORS_ORIGINS:-http://localhost:3000}
      ORBIT_PUBLIC_BASE_URL: ${ORBIT_PUBLIC_BASE_URL:-http://localhost:8080}
      # The web container proxies browser traffic; believe its X-Forwarded-For.
      ORBIT_TRUSTED_PROXIES: ${ORBIT_TRUSTED_PROXIES:-172.16.0.0/12}
      ORBIT_WORKER_API_URL: http://host.docker.internal:8080
      ORBIT_LAUNCHER_URL: http://launcher:8090
      ORBIT_LAUNCHER_TOKEN: ${ORBIT_LAUNCHER_TOKEN:-orbit-dev-launcher-token}
      ORBIT_LOG_FORMAT: ${ORBIT_LOG_FORMAT:-text}
    ports:
      - "8080:8080"  # all interfaces: launcher-started worker containers reach the API via host.docker.internal (bridge IP on Linux)
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    image: orbit-worker:dev
    environment:
      ORBIT_ENV: ${ORBIT_ENV:-development}
      ORBIT_WORKER_HARNESSES: mock
      ORBIT_WORKER_TARGET: docker
      ORBIT_API_URL: http://host.docker.internal:8080
      ORBIT_WORKER_TOKEN: ${ORBIT_WORKER_TOKEN:?ORBIT_WORKER_TOKEN is required}
      ORBIT_WORKER_POLL_MS: ${ORBIT_WORKER_POLL_MS:-500}
      ORBIT_WORKER_CONCURRENCY: ${ORBIT_WORKER_CONCURRENCY:-4}
      ORBIT_WORKSPACE_ROOT: /tmp/orbit-workspaces
      ORBIT_LOG_FORMAT: ${ORBIT_LOG_FORMAT:-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  launcher:
    # Not published on the host: it controls the Docker socket. The default token below
    # is a documented dev value that is only reachable on the Compose network; set
    # ORBIT_LAUNCHER_TOKEN outside local development.
    build:
      context: ../..
      dockerfile: deploy/docker/launcher.Dockerfile
    image: orbit-launcher:dev
    environment:
      ORBIT_LAUNCHER_TOKEN: ${ORBIT_LAUNCHER_TOKEN:-orbit-dev-launcher-token}
      ORBIT_LAUNCHER_NAMESPACE: ${ORBIT_LAUNCHER_NAMESPACE:-orbit}
      ORBIT_OPENCODE_AUTH_EXPORT: /auth/auth-export.json
      ORBIT_OPENCODE_AUTH_HOST_PATH: ${ORBIT_OPENCODE_AUTH_HOST_PATH:-}
      ORBIT_PI_AGENT_DIR: /auth/pi-agent
      ORBIT_PI_AGENT_HOST_DIR: ${ORBIT_PI_AGENT_HOST_DIR:-}
      ORBIT_LAUNCHER_IMAGE_ALIASES: ${ORBIT_LAUNCHER_IMAGE_ALIASES:-}
      ORBIT_LOG_FORMAT: ${ORBIT_LOG_FORMAT:-text}
    # The image runs as UID 10001; it needs the group that owns the Docker socket.
    # Docker Desktop exposes the socket to group 0; on Linux set DOCKER_GID to
    # `stat -c %g /var/run/docker.sock`.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Must exist as a file before `docker compose up`; otherwise Docker creates a directory.
      - ../../.orbit-auth-export.json:/auth/auth-export.json:ro
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    image: orbit-web:dev
    environment:
      ORBIT_API_INTERNAL_URL: http://api:8080
      ORBIT_WEB_DEV_TOKEN: ${ORBIT_DEV_TOKEN:-orbit-dev-token}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  orbit-db:
  orbit-nats:
