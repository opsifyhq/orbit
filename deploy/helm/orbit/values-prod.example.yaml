# ORBIT production-oriented values (example).
#
# - External PostgreSQL and NATS (no bundled stateful services)
# - OIDC authentication with externally managed secrets
# - Private registry, multiple replicas
# - TLS ingress at orbit.example.com
#
# Usage:
#   helm upgrade --install orbit ./deploy/helm/orbit \
#     --namespace orbit --create-namespace \
#     -f deploy/helm/orbit/values-prod.example.yaml
#
# Image tags: this file sets no `tag:` for any component. An empty tag follows
# `Chart.appVersion`, so the images always match the chart you install.
# To pin explicitly, pass `--set api.tag=<version>` (likewise `worker.tag`, `web.tag`,
# `launcher.tag`, `opencodeWorker.tag`, `piWorker.tag`) or add `tag: "<version>"` under
# the component. scripts/check-versions.sh fails CI if a shipped values file pins a tag
# that differs from `appVersion`.

nameOverride: ""
fullnameOverride: ""

imageRegistry: registry.example.com:5000
imagePullPolicy: IfNotPresent
imagePullSecrets: []

api:
  image: orbit-api
  replicas: 2
  port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

worker:
  # Platform workers are launched from worker profiles through the launcher (below).
  # Enable this only for a fixed worker, and add `worker-token` to the external Secret.
  enabled: false
  image: orbit-worker
  replicas: 2
  concurrency: 8
  pollIntervalMs: 500
  schedulerEnabled: false # enable on exactly one replica until HA scheduling lands
  harnesses: mock

opencodeWorker:
  # Fixed worker. For profile-launched OpenCode, leave this off and create a profile
  # with authSecretName=orbit-opencode-auth; the launcher mints the token per launch.
  enabled: false
  image: orbit-worker-opencode
  replicas: 1
  concurrency: 2
  harnesses: opencode
  auth:
    # Create from a logged-in OpenCode install:
    #   opencode auth export > auth-export.json
    #   kubectl -n orbit create secret generic orbit-opencode-auth \
    #     --from-file=auth-export.json=auth-export.json
    existingSecret: orbit-opencode-auth
    key: auth-export.json
  config:
    existingConfigMap: ""
    key: opencode.json
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  workspace:
    sizeLimit: 2Gi

piWorker:
  enabled: false
  image: orbit-worker-pi
  replicas: 1
  concurrency: 2
  harnesses: pi
  auth:
    # Create from a Pi install:
    #   kubectl -n orbit create secret generic orbit-pi-auth \
    #     --from-file=auth.json=$HOME/.pi/agent/auth.json
    existingSecret: orbit-pi-auth
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "2"
      memory: 2Gi

web:
  image: orbit-web
  replicas: 2
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

license:
  # Airgapped: create a Secret with the signed license file.
  #   kubectl -n orbit create secret generic orbit-license --from-file=license.jwt
  existingSecret: orbit-license
  key: license.jwt

auth:
  mode: oidc
  oidc:
    issuer: https://dex.example.com
    audience: orbit
    jwksUrl: https://dex.example.com/keys
    scopes: "openid profile email"
    autoProvision: true
    defaultRole: viewer
    # Optional group → role mapping (Dex/Keycloak must return the claim).
    roleClaim: groups
    # Claim used as the unique OIDC identity/email (default email). Use `name` when
    # multiple IdP accounts share the same email.
    emailClaim: email
    groupRoles: {}
    # Optional IdP group -> "access-team-slug:role" mapping (lead/member/viewer).
    teamGroups: {}
    autoCreateTeams: false
    requireMappedGroup: false
    syncRoles: false
    requireVerifiedEmail: true

# Manage secrets externally (Vault, External Secrets, sealed-secrets, …).
# Required keys: database-url, master-key, launcher-token when the launcher is enabled,
# plus worker-token / opencode-worker-token / pi-worker-token for any fixed worker that
# is enabled (the chart cannot generate them into an existing Secret).
secrets:
  create: false
  existingSecret: orbit-secrets
  masterKey: ""
  databaseUrl: ""

postgresql:
  enabled: false

externalDatabase:
  enabled: true
  # Either a full URL...
  # url: postgres://orbit:CHANGE_ME@postgres.example.internal:5432/orbit?sslmode=require
  # ...or an operator-managed Secret (e.g. CNPG) with host/port/dbname/user/password.
  existingSecret: orbit-pg-app
  # urlKey: uri   # use this when the Secret already contains a complete URL

nats:
  enabled: false

externalNats:
  enabled: true
  url: nats://nats.example.internal:4222

launcher:
  # Default worker path. `launcher-token` must be present in secrets.existingSecret and
  # should be generated with: openssl rand -base64 36
  enabled: true
  image: orbit-launcher

platform:
  environment: production
  seedDemo: false
  seedWorkerProfile: false # create worker profiles explicitly in Workers
  logFormat: json
  corsOrigins: "https://orbit.example.com"
  publicBaseUrl: "https://orbit.example.com"
  bodyLimitBytes: "2097152"

vault:
  enabled: false
  addr: ""
  existingSecret: ""

ingress:
  enabled: true
  host: orbit.example.com
  ingressClassName: nginx
  tls:
    enabled: true
    secretName: orbit-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"

serviceAccount:
  create: true
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
