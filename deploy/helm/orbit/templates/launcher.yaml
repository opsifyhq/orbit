{{- if .Values.launcher.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orbit.fullname" . }}-launcher
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orbit.fullname" . }}-launcher
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # pods/log is a subresource; only get is meaningful (kubectl logs).
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Per-launch worker env Secret (worker token + profile env), created right after its
  # workload with an owner reference to it, and deleted on relaunch. There is no
  # get/list/watch/patch, so the launcher cannot read Secret values through the API. RBAC
  # cannot scope `create` by name or content, though: on its own this Role would let a
  # stolen launcher token create a pod that mounts any Secret in the namespace, or
  # delete ORBIT's own workloads. launcher-admission.yaml closes that with admission
  # policies (names, Secret types and pod contents); keep them enabled, or enforce the
  # same rules with your own admission controller.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orbit.fullname" . }}-launcher
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orbit.fullname" . }}-launcher
subjects:
  - kind: ServiceAccount
    name: {{ include "orbit.fullname" . }}-launcher
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbit.fullname" . }}-launcher
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "orbit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: launcher
  template:
    metadata:
      labels:
        {{- include "orbit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: launcher
      {{- if or .Values.podAnnotations .Values.secrets.create }}
      annotations:
        {{- if .Values.secrets.create }}
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "orbit.fullname" . }}-launcher
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: launcher
          image: {{ include "orbit.image" (dict "root" . "registry" .Values.imageRegistry "image" .Values.launcher.image "tag" .Values.launcher.tag) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # kubectl may try to cache discovery data under $HOME.
            - name: HOME
              value: "/tmp"
            - name: ORBIT_LAUNCHER_ADDR
              value: "0.0.0.0:8090"
            - name: ORBIT_LAUNCHER_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ORBIT_WORKER_AUTH_SECRETS
              value: {{ .Values.launcher.authSecrets | quote }}
            - name: ORBIT_MAX_APPROVAL_WAIT_SECONDS
              value: {{ .Values.maxApprovalWaitSeconds | quote }}
            - name: ORBIT_LAUNCHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit.secretName" . }}
                  key: launcher-token
            {{- with include "orbit.launcherImagePullSecret" . }}
            - name: ORBIT_LAUNCHER_IMAGE_PULL_SECRET
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
          # /healthz is unauthenticated and does not touch Docker or Kubernetes.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 15
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.launcher.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbit.fullname" . }}-launcher
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: http
      name: http
  selector:
    {{- include "orbit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
{{- end }}
