apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbit.apiHost" . }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "orbit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- if or .Values.podAnnotations .Values.secrets.create }}
      annotations:
        {{- if .Values.secrets.create }}
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "orbit.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "orbit.image" (dict "root" . "registry" .Values.imageRegistry "image" .Values.api.image "tag" .Values.api.tag) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          env:
            - name: ORBIT_ENV
              value: {{ .Values.platform.environment | quote }}
            - name: ORBIT_HTTP_ADDR
              value: "0.0.0.0:{{ .Values.api.port }}"
            - name: ORBIT_AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            {{- if and .Values.externalDatabase.enabled .Values.externalDatabase.existingSecret }}
            {{- if .Values.externalDatabase.urlKey }}
            - name: ORBIT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.urlKey }}
            {{- else }}
            - name: ORBIT_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ default "host" .Values.externalDatabase.hostKey }}
            - name: ORBIT_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ default "port" .Values.externalDatabase.portKey }}
            - name: ORBIT_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ default "dbname" .Values.externalDatabase.databaseKey }}
            - name: ORBIT_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ default "user" .Values.externalDatabase.userKey }}
            - name: ORBIT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ default "password" .Values.externalDatabase.passwordKey }}
            - name: ORBIT_DATABASE_SSLMODE
              value: {{ default "require" .Values.externalDatabase.sslMode | quote }}
            {{- end }}
            {{- else }}
            - name: ORBIT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit.secretName" . }}
                  key: database-url
            {{- end }}
            - name: ORBIT_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit.secretName" . }}
                  key: master-key
            - name: ORBIT_DB_AUTO_MIGRATE
              value: "true"
            - name: ORBIT_EVENTS_DRIVER
              value: "nats"
            - name: ORBIT_NATS_URL
              value: {{ include "orbit.natsUrl" . | quote }}
            - name: ORBIT_CORS_ORIGINS
              value: {{ .Values.platform.corsOrigins | quote }}
            - name: ORBIT_PUBLIC_BASE_URL
              value: {{ .Values.platform.publicBaseUrl | quote }}
            - name: ORBIT_WORKER_API_URL
              value: "http://{{ include "orbit.apiHost" . }}:{{ .Values.api.port }}"
            - name: ORBIT_WORKER_AUTH_SECRETS
              value: {{ .Values.launcher.authSecrets | quote }}
            - name: ORBIT_OUTBOUND_ALLOW_PRIVATE
              value: {{ .Values.outbound.allowPrivate | quote }}
            {{- with .Values.outbound.allowedHosts }}
            - name: ORBIT_OUTBOUND_ALLOWED_HOSTS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.caCertificates.enabled }}
            - name: ORBIT_CA_SECRET_NAME
              value: {{ .Values.caCertificates.secretName | quote }}
            - name: ORBIT_CA_SECRET_KEY
              value: {{ .Values.caCertificates.key | default "ca-bundle.crt" | quote }}
            {{- end }}
            - name: ORBIT_IMAGE_PREFIX
              value: {{ .Values.imageRegistry | quote }}
            - name: ORBIT_IMAGE_TAG
              value: {{ include "orbit.imageTag" . | quote }}
            - name: ORBIT_SEED_WORKER_PROFILE
              value: {{ .Values.platform.seedWorkerProfile | quote }}
            {{- if .Values.launcher.enabled }}
            - name: ORBIT_LAUNCHER_URL
              value: "http://{{ include "orbit.fullname" . }}-launcher:8090"
            - name: ORBIT_LAUNCHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit.secretName" . }}
                  key: launcher-token
            {{- end }}
            - name: ORBIT_SEED_DEMO
              value: {{ .Values.platform.seedDemo | quote }}
            - name: ORBIT_LOG_FORMAT
              value: {{ .Values.platform.logFormat | quote }}
            - name: ORBIT_DEFAULT_ORG_SLUG
              value: {{ .Values.auth.dev.orgSlug | quote }}
            - name: ORBIT_DEFAULT_ORG_NAME
              value: {{ .Values.auth.dev.orgName | quote }}
            - name: ORBIT_BODY_LIMIT_BYTES
              value: {{ .Values.platform.bodyLimitBytes | quote }}
            - name: ORBIT_ARCHIVE_AFTER_DAYS
              value: {{ .Values.platform.archiveAfterDays | quote }}
            - name: ORBIT_AUDIT_RETENTION_DAYS
              value: {{ .Values.platform.auditRetentionDays | quote }}
            {{- with .Values.license }}
            {{- if .value }}
            - name: ORBIT_LICENSE
              value: {{ .value | quote }}
            {{- else if .existingSecret }}
            - name: ORBIT_LICENSE_FILE
              value: "/etc/orbit-license.jwt"
            {{- end }}
            {{- end }}
            {{- if eq .Values.auth.mode "dev" }}
            - name: ORBIT_DEV_AUTH_ALLOW_ANONYMOUS
              value: {{ .Values.auth.dev.allowAnonymous | quote }}
            - name: ORBIT_DEV_USER_EMAIL
              value: {{ .Values.auth.dev.userEmail | quote }}
            - name: ORBIT_DEV_USER_NAME
              value: {{ .Values.auth.dev.userName | quote }}
            - name: ORBIT_DEV_ORG_SLUG
              value: {{ .Values.auth.dev.orgSlug | quote }}
            - name: ORBIT_DEV_ORG_NAME
              value: {{ .Values.auth.dev.orgName | quote }}
            - name: ORBIT_DEV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit.secretName" . }}
                  key: dev-token
            {{- else }}
            - name: ORBIT_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: ORBIT_OIDC_AUDIENCE
              value: {{ .Values.auth.oidc.audience | quote }}
            - name: ORBIT_OIDC_CLIENT_ID
              value: {{ default .Values.auth.oidc.audience .Values.auth.oidc.clientId | quote }}
            - name: ORBIT_OIDC_REDIRECT_URI
              value: {{ default (printf "%s/auth/callback" .Values.platform.publicBaseUrl) .Values.auth.oidc.redirectUri | quote }}
            {{- if .Values.secrets.oidcClientSecret }}
            - name: ORBIT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit.secretName" . }}
                  key: oidc-client-secret
            {{- end }}
            - name: ORBIT_OIDC_JWKS_URL
              value: {{ .Values.auth.oidc.jwksUrl | quote }}
            - name: ORBIT_OIDC_SCOPES
              value: {{ .Values.auth.oidc.scopes | quote }}
            - name: ORBIT_OIDC_AUTO_PROVISION
              value: {{ .Values.auth.oidc.autoProvision | quote }}
            - name: ORBIT_OIDC_DEFAULT_ROLE
              value: {{ .Values.auth.oidc.defaultRole | quote }}
            - name: ORBIT_OIDC_ROLE_CLAIM
              value: {{ .Values.auth.oidc.roleClaim | quote }}
            - name: ORBIT_OIDC_EMAIL_CLAIM
              value: {{ .Values.auth.oidc.emailClaim | quote }}
            - name: ORBIT_OIDC_GROUP_ROLES
              value: {{ .Values.auth.oidc.groupRoles | toJson | quote }}
            - name: ORBIT_OIDC_TEAM_GROUPS
              value: {{ .Values.auth.oidc.teamGroups | toJson | quote }}
            - name: ORBIT_OIDC_AUTO_CREATE_TEAMS
              value: {{ .Values.auth.oidc.autoCreateTeams | quote }}
            - name: ORBIT_OIDC_REQUIRE_MAPPED_GROUP
              value: {{ .Values.auth.oidc.requireMappedGroup | quote }}
            - name: ORBIT_OIDC_SYNC_ROLES
              value: {{ .Values.auth.oidc.syncRoles | quote }}
            - name: ORBIT_OIDC_REQUIRE_VERIFIED_EMAIL
              value: {{ .Values.auth.oidc.requireVerifiedEmail | quote }}
            {{- end }}
            {{- if .Values.vault.enabled }}
            - name: VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
            {{- end }}
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
            {{- if .Values.caCertificates.enabled }}
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/ca-bundle.crt"
            - name: REQUESTS_CA_BUNDLE
              value: "/etc/ssl/certs/ca-bundle.crt"
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/ssl/certs/ca-bundle.crt"
            {{- end }}
          volumeMounts:
            {{- if .Values.caCertificates.enabled }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: {{ .Values.caCertificates.key }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.license }}
            {{- if and .existingSecret (not .value) }}
            - name: license
              mountPath: /etc/orbit-license.jwt
              subPath: {{ .key | default "license.jwt" }}
              readOnly: true
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          # /readyz gates on PostgreSQL only; a NATS outage is reported in the body
          # (checks.eventBus) but does not remove pods from the Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- if .Values.caCertificates.enabled }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.caCertificates.secretName }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- with .Values.license }}
        {{- if and .existingSecret (not .value) }}
        - name: license
          secret:
            secretName: {{ .existingSecret }}
            items:
              - key: {{ .key | default "license.jwt" }}
                path: {{ .key | default "license.jwt" }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbit.apiHost" . }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: http
      name: http
  selector:
    {{- include "orbit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
