# Sidebar of the in-app documentation (Documentation in the web app, /api/v1/docs).
#
# Sections follow the app's own sidebar — Build, Connect, Infrastructure, Admin — so a
# page sits where the matching screen lives, followed by the operator and contributor
# material. Files stay where they are; this file only decides grouping, order and the
# short label shown in the sidebar (`title`, defaulting to the page's first heading).
#
# Every Markdown page under docs/ must be listed here (planning/ is not served). A test in
# crates/orbit-api/src/docs.rs fails when a page is missing or a listed path does not exist.

sections:
  - id: start
    title: Get started
    pages:
      - path: README.md
        title: Introduction
      - path: guide/README.md
        title: How ORBIT fits together
      - path: development/local.md
        title: Run ORBIT locally

  # The sidebar's first group (Overview, Executions, Approvals) has no label, and Start
  # work is its button, so these three pages share one section.
  - id: work
    title: Run work
    pages:
      - path: guide/start-work.md
        title: Start work
      - path: guide/executions.md
        title: Executions
      - path: guide/approvals.md
        title: Approvals

