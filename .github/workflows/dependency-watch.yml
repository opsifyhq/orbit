name: Dependency watch
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only print proposals, do not open an issue
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check external versions
        run: node scripts/check-updates.mjs --json > /tmp/proposals.json
      - name: Open an actionable issue
        if: github.event.inputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(jq length /tmp/proposals.json)
          if [ "$count" = "0" ]; then echo "No updates"; exit 0; fi
          {
            echo "The scheduled dependency watcher found upstream updates. Review the checksums and run the matching E2E before merging."
            echo
            jq -r '.[] | "- **\(.name)**: `\(.current)` → `\(.candidate)`" + (if .note != "" then " — \(.note)" else "" end)' /tmp/proposals.json
            echo
            echo 'Run `node scripts/check-external-versions.mjs` after updating `versions.json` and the pinned files.'
          } > /tmp/issue.md
          gh label create dependency-update --color FBCA04 --description "Automated dependency proposal" 2>/dev/null || true
          existing=$(gh issue list --label dependency-update --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue.md
          else
            gh issue create --title "Dependency and harness updates available" --body-file /tmp/issue.md --label dependency-update
          fi
