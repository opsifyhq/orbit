# CI: tests, lint, security scans and container image builds.
#
# Runs on every push/PR to main and on `v*` tags. Container images are pushed only on
# `v*` tags (the release path) or manual dispatch with push_images=true; PRs build them
# without pushing (images-check) and lint/template the Helm chart, so normal main
# pushes stay fast. Third-party actions are pinned to commit SHAs (tag in the comment). Superseded runs on the same ref are cancelled, except tags.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push built images to GHCR"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; jobs that publish raise their own permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- rust tests
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version alignment
        run: ./scripts/check-versions.sh

      # A release tag must name the version that is actually in the tree; otherwise the
      # images get the tag's version while the chart still deploys the previous one.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(awk -F'"' '/^appVersion:/ {print $2; exit}' deploy/helm/orbit/Chart.yaml)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version in the tree (${version}). Bump the version first."
            exit 1
          fi

      # The toolchain version (and components) come from rust-toolchain.toml, the single
      # source of truth, so CI and local builds use the same compiler.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Cache only what is reused across commits; target/ grows past the cache limit.
          cache-targets: "true"
          cache-all-crates: "true"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Fails on vulnerability advisories and puts informational warnings in the job
      # summary so unmaintained dependencies do not go unnoticed.
      - name: cargo audit
        # Run cargo-audit directly. rustsec/audit-check@v2 tries to update a check run and
        # fails on some token/permission combinations even when no advisory is found.
        run: |
          cargo install cargo-audit --locked
          set +e
          cargo audit | tee /tmp/orbit-cargo-audit.txt
          status=${PIPESTATUS[0]}
          {
            echo "### cargo audit"
            echo '```'
            sed -n '1,240p' /tmp/orbit-cargo-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: cargo test (unit + DB integration)
        env:
          ORBIT_TEST_DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
        run: cargo test --workspace

      # Production uses the NATS event bus, so its integration tests run against a real
      # JetStream server. They are #[ignore]d for local runs without one. A service
      # container cannot pass `-js`, hence docker run.
      - name: cargo test (NATS JetStream integration)
        env:
          ORBIT_TEST_NATS_URL: nats://127.0.0.1:4222
        run: |
          docker run -d --rm --name nats -p 127.0.0.1:4222:4222 nats:2.11-alpine -js
          for _ in $(seq 1 20); do nc -z 127.0.0.1 4222 && break; sleep 1; done
          cargo test -p orbit-events --test nats_integration -- --ignored --test-threads=1

  # ---------------------------------------------------------------- MSRV
  # Cargo.toml declares `rust-version`; CI otherwise builds only the pinned toolchain from
  # rust-toolchain.toml. Type-check every crate and target on the declared minimum so a
  # newer language or std feature cannot slip in unnoticed. No tests: the main job runs
  # them on the pinned toolchain.
  msrv:
    name: Rust MSRV (cargo check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the declared minimum toolchain
        run: |
          msrv="$(sed -nE 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "${msrv}" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          rustup toolchain install "${msrv}" --profile minimal
          echo "MSRV=${msrv}" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv

      - name: cargo check on the MSRV
        run: cargo "+${MSRV}" check --workspace --all-targets --locked

  # ---------------------------------------------------------------- frontend
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # All workspace packages, not only the web app (api-client, contracts).
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Documentation links and paths
        run: pnpm docs:check

      - name: Unit tests
        run: pnpm --filter @orbit/web test

      # The other half of the API drift gate: a Rust test keeps openapi.json in step with
      # the code, this keeps the generated TypeScript in step with openapi.json.
      - name: API client is up to date
        run: node scripts/generate-api-client.mjs --check

      - name: Build
        run: pnpm --filter @orbit/web build

      # Fails on high/critical advisories. To accept a specific advisory, add
      # `--ignore <GHSA-id>` here with a comment saying why (none are ignored today).
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  # ---------------------------------------------------------------- secret scan
  secrets:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          path: ./
          # Fail only on verified (live) secrets; unverified matches are ignored.
          extra_args: --only-verified  # the action adds --fail itself

  # ---------------------------------------------------------------- helm validation
  helm:
    name: Helm chart (lint + template)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.3

      # Validates the rendered manifests against the Kubernetes JSON schemas (strict: unknown
      # fields fail). Pinned release, checked against its published SHA-256.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSLo "${RUNNER_TEMP}/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${RUNNER_TEMP}/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/kubeconform.tar.gz" -C "${RUNNER_TEMP}/bin" kubeconform
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: helm lint
        run: helm lint deploy/helm/orbit

      # Every render below is validated with kubeconform. KUBE_VERSION is the oldest version
      # the default values support (the launcher ValidatingAdmissionPolicies need 1.30);
      # the chart README's 1.27 floor is checked with the admission policies off.
      - name: helm template
        # Default values use dev auth behind the ingress; acknowledge it so the render check
        # works with the production guardrails from #128 (ignored by charts without them).
        env:
          KUBE_VERSION: 1.30.0
        # pipefail: a failing render must not reach kubeconform as an empty, passing input.
        run: |
          set -euo pipefail
          helm template orbit deploy/helm/orbit -n orbit -f deploy/helm/orbit/values.yaml \
            --set auth.acknowledgeInsecureDev=true \
            | kubeconform -strict -summary -kubernetes-version "${KUBE_VERSION}"
          helm template orbit deploy/helm/orbit -n orbit -f deploy/helm/orbit/values.yaml \
            --set auth.acknowledgeInsecureDev=true \
            --set launcher.admissionPolicy.enabled=false \
            | kubeconform -strict -summary -kubernetes-version 1.27.0

      # The variants people actually deploy: the production example and the optional parts.
      # ServiceMonitor is a Prometheus Operator CRD with no schema in the Kubernetes set;
      # it is skipped, everything else in that render is validated.
      - name: helm template (production example, network policy, fixed worker)
        env:
          KUBE_VERSION: 1.30.0
        # pipefail: a failing render must not reach kubeconform as an empty, passing input.
        run: |
          set -euo pipefail
          helm template orbit deploy/helm/orbit -n orbit \
            -f deploy/helm/orbit/values-prod.example.yaml \
            | kubeconform -strict -summary -kubernetes-version "${KUBE_VERSION}"
          helm template orbit deploy/helm/orbit -n orbit -f deploy/helm/orbit/values.yaml \
            --set auth.acknowledgeInsecureDev=true \
            --set networkPolicy.enabled=true \
            --set worker.enabled=true --set worker.token=render-check-only \
            | kubeconform -strict -summary -kubernetes-version "${KUBE_VERSION}"
          helm template orbit deploy/helm/orbit -n orbit -f deploy/helm/orbit/values.yaml \
            --set auth.acknowledgeInsecureDev=true \
            --set networkPolicy.enabled=true \
            --set monitoring.serviceMonitor.enabled=true \
            --set monitoring.port=9090 \
            --set monitoring.token.existingSecret=render-check-only \
            | kubeconform -strict -summary -kubernetes-version "${KUBE_VERSION}" -skip ServiceMonitor

  # ---------------------------------------------------------------- migrations
  # AGENTS.md rule 7: migrations are append-only. A migration that already exists on the
  # base branch may have been applied somewhere, so a change may add files but never
  # edit, rename or delete one. Checked on PRs and on every push to main (direct pushes
  # and merges of PRs whose base moved), against the previous state of the branch.
  migrations:
    name: Migrations are append-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No existing migration was changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="origin/${BASE_REF}"
          elif [ -n "${BEFORE}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            base="${BEFORE}"
          else
            echo "No previous commit to compare with."
            exit 0
          fi
          changed="$(git diff --name-status --no-renames "${base}...HEAD" -- crates/orbit-store/migrations | grep -v '^A' || true)"
          if [ -n "${changed}" ]; then
            echo "::error::Existing migrations were modified or removed. Add a new migration instead."
            echo "${changed}"
            exit 1
          fi

  # ---------------------------------------------------------------- image build check
  # PR-time proof that the Dockerfiles still build. Nothing is pushed or logged in, so it
  # also works for PRs from forks. Mirrors the `images` matrix (keep them in sync); the
  # harness worker images are checked in `harness-images-check`.
  images-check:
    name: Build check (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/docker/api.Dockerfile
          - name: worker
            dockerfile: deploy/docker/worker.Dockerfile
          - name: web
            dockerfile: deploy/docker/web.Dockerfile
          - name: launcher
            dockerfile: deploy/docker/launcher.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          # Per-image cache scope so the four builds do not evict each other.
          cache-from: type=gha,scope=check-${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=check-${{ matrix.name }}

  # Harness worker images extend the worker image. On PRs the worker image is pushed to a
  # throwaway local registry so the OpenCode and Pi Dockerfiles (pinned CLI downloads and
  # checksums) are built before a release depends on them.
  harness-images-check:
    name: Build check (harness images)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Lets the builder reach the local registry on localhost:5000.
          driver-opts: network=host

      - name: Build base worker image (local registry)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          push: true
          tags: localhost:5000/orbit-worker:check
          platforms: linux/amd64
          # Reuses the cache of the worker build check above.
          cache-from: type=gha,scope=check-worker

      - name: Build OpenCode worker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/worker-opencode.Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            WORKER_BASE=localhost:5000/orbit-worker:check
          cache-from: type=gha,scope=check-worker-opencode
          cache-to: type=gha,mode=min,scope=check-worker-opencode

      - name: Build Pi worker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/worker-pi.Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            WORKER_BASE=localhost:5000/orbit-worker:check
          cache-from: type=gha,scope=check-worker-pi
          cache-to: type=gha,mode=min,scope=check-worker-pi

  # ---------------------------------------------------------------- images
  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [rust, msrv, web]
    if: ${{ github.event.inputs.push_images == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: deploy/docker/api.Dockerfile
            image: orbit-api
          - name: web
            dockerfile: deploy/docker/web.Dockerfile
            image: orbit-web
          - name: launcher
            dockerfile: deploy/docker/launcher.Dockerfile
            image: orbit-launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ github.event.inputs.push_images == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event.inputs.push_images == 'true' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}

  # The harness images extend the worker image; building the worker in its own job lets
  # them start as soon as it is ready instead of waiting for the slowest API build.
  worker-image:
    name: Build base worker image
    runs-on: ubuntu-latest
    needs: [rust, msrv, web]
    if: ${{ github.event.inputs.push_images == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/orbit-worker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          push: ${{ github.event.inputs.push_images == 'true' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=image-worker
          cache-to: type=gha,mode=max,scope=image-worker

  # ------------------------------------------------------ harness worker images
  # Harness images extend the base worker image, so they build after it and reference
  # the base by its commit tag.
  harness-images:
    name: Build harness worker images
    runs-on: ubuntu-latest
    needs: [worker-image]
    if: ${{ github.event.inputs.push_images == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: worker-opencode
            dockerfile: deploy/docker/worker-opencode.Dockerfile
            image: orbit-worker-opencode
          - name: worker-pi
            dockerfile: deploy/docker/worker-pi.Dockerfile
            image: orbit-worker-pi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            WORKER_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/orbit-worker:${{ github.sha }}
          cache-from: type=gha,scope=harness-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=harness-${{ matrix.name }}

  # ---------------------------------------------------------------- releases
  release:
    name: Release binaries
    runs-on: ubuntu-latest
    # Nothing is published from a tree that fails its tests, and the release is only
    # created once every image it refers to was built and pushed.
    needs: [rust, msrv, web, images, worker-image, harness-images]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build worker binary
        run: cargo build --release --target ${{ matrix.target }} -p orbit-worker --bin orbit-worker

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/orbit-worker orbit-worker-linux-${{ matrix.arch }}
          chmod +x orbit-worker-linux-${{ matrix.arch }}

      - name: Upload to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: orbit-worker-linux-${{ matrix.arch }}
          generate_release_notes: true

  # ---------------------------------------------------------------- helm release
  chart:
    name: Package Helm chart
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # The chart's appVersion names these images: publish it only after all six exist.
    needs: [rust, msrv, web, images, worker-image, harness-images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.3

      - name: Lint chart
        run: helm lint deploy/helm/orbit

      - name: Package chart
        run: |
          mkdir -p dist
          helm package deploy/helm/orbit --destination dist

      - name: Attach chart to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*.tgz
