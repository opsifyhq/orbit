version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      cargo-patch: { patterns: ["*"], update-types: ["patch"] }
      cargo-minor: { patterns: ["*"], update-types: ["minor"] }
    ignore:
      - dependency-name: chrono
      - dependency-name: chrono-tz
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      npm-root: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      npm-web: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/packages/api-client"
    schedule: { interval: weekly }
    groups:
      npm-api-client: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/packages/contracts"
    schedule: { interval: weekly }
    groups:
      npm-contracts: { patterns: ["*"], update-types: ["minor", "patch"] }
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule: { interval: weekly }
    groups:
      docker-base: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      github-actions: { patterns: ["*"] }
