[workspace]
resolver = "2"
members = [
  "crates/orbit-domain",
  "crates/orbit-contracts",
  "crates/orbit-store",
  "crates/orbit-events",
  "crates/orbit-security",
  "crates/orbit-harness",
  "crates/orbit-kubernetes",
  "crates/orbit-s3",
  "crates/orbit-api",
  "services/api",
  "services/worker",
  "services/launcher",
  "services/license-cli",
]

[workspace.package]
version = "0.28.7"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/opsifyhq/orbit"

[workspace.dependencies]
orbit-domain = { path = "crates/orbit-domain" }
orbit-contracts = { path = "crates/orbit-contracts" }
orbit-store = { path = "crates/orbit-store" }
orbit-events = { path = "crates/orbit-events" }
orbit-security = { path = "crates/orbit-security" }
orbit-harness = { path = "crates/orbit-harness" }
orbit-kubernetes = { path = "crates/orbit-kubernetes" }
orbit-s3 = { path = "crates/orbit-s3" }
orbit-api = { path = "crates/orbit-api" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tempfile = "3"
async-stream = "0.3"
dotenvy = "0.15"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
  "macros",
] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "request-id", "limit", "timeout"] }
http = "1"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
serde_yaml = { package = "serde_norway", version = "0.9" }
async-nats = "0.53"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "12", default-features = false, features = ["use_pem", "rust_crypto"] }
aes-gcm = "0.11"
base64 = "0.23"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
hmac = "0.13"
quick-xml = "0.42"
url = "2"
libc = "0.2"
croner = "4"
chrono-tz = "0.10"
regex = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
